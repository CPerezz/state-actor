# Exercises every v1 schema feature in one file. This shape is the candidate
# for examples/spec-ci-baseline.yaml — the CI YAML that the cross-client spec
# state-root invariant runs against.
entities:
  # Template-driven contract with explicit address.
  - kind: contract
    template: erc20
    name: explicit-token
    address: 0x000000000000000000000000000000000000aaaa
    balance: "0"
    parameters:
      symbol: EXP
      decimals: 6
      name: Explicit
    approximate_size_bytes: 100_000

  # Template-driven contract with name-derived address.
  - kind: contract
    template: erc20
    name: named-token
    parameters:
      symbol: NMD
      decimals: 18
      name: NamedToken
    approximate_size_bytes: 100_000

  # Template-driven contract with position-derived address (no name, no addr).
  - kind: contract
    template: erc20
    parameters:
      symbol: ANON
      decimals: 18
      name: AnonToken
    approximate_size_bytes: 50_000

  # Raw-bytecode contract with synthetic storage bloat.
  - kind: contract
    name: my-custom-contract
    code: "0x6080604052348015600f57600080fd5b50603f80601d6000396000f3fe6080604052600080fdfea2"
    approximate_size_bytes: 50_000

  # EOA with EIP-7702 delegation and storage bloat.
  - kind: eoa
    name: bloated-validator
    balance: "1000000000000000000"
    nonce: 10
    code: "0xef01001111111111111111111111111111111111111111"
    approximate_size_bytes: 100_000

  # Plain EOA with explicit address.
  - kind: eoa
    address: 0x1111111111111111111111111111111111111111
    balance: "1000000000000000000"
    nonce: 0

  # Template-default storage only (no approximate_size_bytes).
  - kind: contract
    template: erc20
    name: skeleton-token
    parameters:
      symbol: SKL
      decimals: 18
      name: SkeletonToken
