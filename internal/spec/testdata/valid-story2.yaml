# Story 2 from the spec design doc: any client, EOA storage bloat via 7702
# delegation. 10M synthetic accounts come from --accounts=10000000, not from
# this spec. The spec only adds the three bloated EOAs.
entities:
  - kind: eoa
    name: bloated-eoa-10g
    balance: "1000000000000000000"
    nonce: 0
    code: "0xef01001111111111111111111111111111111111111111"
    approximate_size_bytes: 10_000_000_000

  - kind: eoa
    name: bloated-eoa-5g
    balance: "1000000000000000000"
    nonce: 0
    code: "0xef01002222222222222222222222222222222222222222"
    approximate_size_bytes: 5_000_000_000

  - kind: eoa
    name: bloated-eoa-2g
    balance: "1000000000000000000"
    nonce: 0
    code: "0xef01003333333333333333333333333333333333333333"
    approximate_size_bytes: 2_000_000_000
