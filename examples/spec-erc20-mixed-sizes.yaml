# Story 1: a reth MDBX dataset containing three ERC-20 tokens of different
# sizes plus five EIP-7702 delegated EOAs.
#
# To use:
#   state-actor --client=reth --db=/tmp/story1 \
#     --spec=examples/spec-erc20-mixed-sizes.yaml \
#     --contracts=20 --min-slots=1 --max-slots=10 \
#     --target-size=20GB
#
# Spec writes the three ERC-20s + five EOAs first; the existing synthetic-
# fill loop then adds --contracts=20 random-code contracts on top until
# --target-size is reached.
entities:
  # Three ERC-20s of decreasing size. v1 uses a stub runtime bytecode —
  # storage layout is correct (OZ v5: _balances at slot 0, _totalSupply
  # at slot 2, _name/_symbol at slots 3/4) but eth_call returns zero.
  - kind: contract
    template: erc20
    name: token-large
    parameters:
      symbol: TOKL
      decimals: 18
      name: TokenLarge
    approximate_size_bytes: 10_000_000_000

  - kind: contract
    template: erc20
    name: token-mid
    parameters:
      symbol: TOKM
      decimals: 18
      name: TokenMid
    approximate_size_bytes: 5_000_000_000

  - kind: contract
    template: erc20
    name: token-small
    parameters:
      symbol: TOKS
      decimals: 18
      name: TokenSmall
    approximate_size_bytes: 1_000_000_000

  # Five EOAs with EIP-7702 delegation markers. Each delegates to a
  # different target contract (you'd replace these placeholders with
  # actual deployed contract addresses).
  - kind: eoa
    name: delegator-1
    balance: "1000000000000000000"
    nonce: 10
    code: "0xef0100aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"

  - kind: eoa
    name: delegator-2
    balance: "1000000000000000000"
    nonce: 10
    code: "0xef0100bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"

  - kind: eoa
    name: delegator-3
    balance: "1000000000000000000"
    nonce: 10
    code: "0xef0100cccccccccccccccccccccccccccccccccccccccc"

  - kind: eoa
    name: delegator-4
    balance: "1000000000000000000"
    nonce: 10
    code: "0xef0100dddddddddddddddddddddddddddddddddddddddd"

  - kind: eoa
    name: delegator-5
    balance: "1000000000000000000"
    nonce: 10
    code: "0xef0100eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee"
