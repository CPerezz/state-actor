# CI-fast fixture for the spec-driven invariant tests.
#
# Exercises every v1 schema feature in one file but with kilobyte-scale
# approximate_size_bytes so the test runs in <1s per writer. The heavier
# spec-ci-baseline.yaml is reserved for nightlies.
#
# Used by `client/geth/e2e_test.go:TestE2ESuiteSpec` (and, once v1.5 lands
# the cross-client invariant aggregator, by the besu/nethermind/reth
# spec suites too).
#
# Note on `approximate_size_bytes`: per-client calibration factors differ,
# so the same approximate_size_bytes value produces different slot counts
# on each client. For the cross-client invariant test (v1.5), the suite
# overrides the Sizer to `sizecal.NewFixed(64)` to neutralize this. The
# geth-only Tier 1 test doesn't need that override.
entities:
  # 1. Template-driven contract with explicit address.
  - kind: contract
    template: erc20
    name: explicit-token
    address: 0x000000000000000000000000000000000000aaaa
    parameters:
      symbol: EXP
      decimals: 6
      name: Explicit
    approximate_size_bytes: 100_000

  # 2. Template-driven contract with name-derived address.
  - kind: contract
    template: erc20
    name: named-token
    parameters:
      symbol: NMD
      decimals: 18
      name: NamedToken
    approximate_size_bytes: 100_000

  # 3. Raw-bytecode contract with synthetic storage bloat.
  - kind: contract
    name: my-raw
    code: "0x6080604052348015600f57600080fd5b50603f80601d6000396000f3fe6080604052600080fdfea2"
    approximate_size_bytes: 50_000

  # 4. EOA with EIP-7702 delegation marker AND storage bloat.
  - kind: eoa
    name: bloated-validator
    balance: "1000000000000000000"
    nonce: 10
    code: "0xef01001111111111111111111111111111111111111111"
    approximate_size_bytes: 100_000

  # 5. Plain EOA with explicit address.
  - kind: eoa
    address: 0x2222222222222222222222222222222222222222
    balance: "1000000000000000000"

  # 6. Template-default storage only (no approximate_size_bytes).
  - kind: contract
    template: erc20
    name: skeleton-token
    parameters:
      symbol: SKL
      decimals: 18
      name: SkeletonToken
