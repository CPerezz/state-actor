# Canonical CI fixture for the --spec feature.
#
# Drives every per-client TestE2ESuite (geth/besu/nethermind/reth). The
# cross-client-genesis-root aggregator job verifies the spec invariant:
# same YAML + same --seed → identical state root on all four MPT clients.
#
# **DO NOT USE THIS FIXTURE LOCALLY without `sizecal.NewFixed(64)`.** Each
# client's calibration factor (geth=64, besu=64, nethermind=80, reth=60)
# produces DIFFERENT slot counts for the same approximate_size_bytes,
# which would false-fail the cross-client invariant. The shared CI helper
# (`internal/e2e_testing/spec_setup.go:LoadCISpecPreAlloc`) hardcodes
# NewFixed(64) so all clients agree.
#
# Spamoor sender (entity 1 below) lives at oracle.SpamoorSenderAddr —
# `internal/oracle/devkeys.go:15`. If the constant changes,
# `internal/e2e_testing/spec_setup_test.go:TestCISpecMatchesSpamoorSender`
# fails loud so the YAML and the constant stay in sync.
#
# Total on-disk footprint: ~700 KB (12 entities × ~50 KB synthesized
# storage each, plus the ERC-20 _balances mappings). Per-leg CI runtime
# is <1 s for the spec layer.
entities:
  # ── 1. Spamoor sender ────────────────────────────────────────────────
  # Funded with 999_999_999 ETH. spamoor signs txs with the matching
  # private key (oracle.SpamoorSenderPrivKey).
  - kind: eoa
    name: spamoor-sender
    address: 0x7e5f4552091a69125d5dfcb7b8c2659029395bdf
    balance: "999999999000000000000000000"
    nonce: 0

  # ── 2-6. ERC-20 flavor coverage ──────────────────────────────────────
  # Different address-resolution modes + parameter shapes. Uses
  # `total_owners` (explicit random-fill count) for deterministic
  # cross-client output. decimals must equal 18 (OZ v5 base default;
  # the template rejects other values).

  # Explicit address + bulk random fill.
  - kind: contract
    template: erc20
    name: explicit-token
    address: 0x000000000000000000000000000000000000aaaa
    parameters:
      symbol: EXP
      decimals: 18
      name: Explicit
      total_owners: 500

  # Name-derived address + bulk random fill.
  - kind: contract
    template: erc20
    name: named-token
    parameters:
      symbol: NMD
      decimals: 18
      name: NamedToken
      total_owners: 250

  # Position-derived address (no `name`, no `address`) + bulk random fill.
  - kind: contract
    template: erc20
    parameters:
      symbol: ANO
      decimals: 18
      name: AnonToken
      total_owners: 100

  # Skeleton ERC-20 — no total_owners, no approximate_size_bytes.
  # Should produce only the explicit _name / _symbol slots, no _totalSupply.
  - kind: contract
    template: erc20
    name: skeleton-token
    parameters:
      symbol: SKL
      decimals: 18
      name: SkeletonToken

  # ERC-20 with explicit nonce override (tests TestERC20NonceHonorsUserValue
  # at e2e level — the contract has nonce=42 in genesis state).
  - kind: contract
    template: erc20
    name: nonce-overridden-token
    nonce: 42
    parameters:
      symbol: N42
      decimals: 18
      name: NonceOverride
      total_owners: 50

  # ── 7-8. Raw bytecode contract flavors ───────────────────────────────

  # Explicit address + raw code + approximate_size_bytes for storage.
  - kind: contract
    name: raw-explicit
    address: 0x000000000000000000000000000000000000bbbb
    code: "0x6080604052348015600f57600080fd5b50603f80601d6000396000f3fe6080604052600080fdfea2"
    approximate_size_bytes: 20_000

  # Name-derived address + code only (no synthesized storage).
  - kind: contract
    name: raw-named
    code: "0x60606040526000357c01000000000000000000000000000000000000000000000000000000009004"

  # ── 9-10. EIP-7702 EOA flavors ───────────────────────────────────────

  # 7702 delegation + nonce.
  - kind: eoa
    name: delegator
    balance: "1000000000000000000"
    nonce: 10
    code: "0xef01001111111111111111111111111111111111111111"

  # 7702 delegation + storage bloat.
  - kind: eoa
    name: bloated-validator
    balance: "1000000000000000000"
    nonce: 1
    code: "0xef01002222222222222222222222222222222222222222"
    approximate_size_bytes: 30_000

  # ── 11-13. Plain EOA flavors ─────────────────────────────────────────

  # Explicit address.
  - kind: eoa
    address: 0x3333333333333333333333333333333333333333
    balance: "5000000000000000000"
    nonce: 1

  # Name-derived address.
  - kind: eoa
    name: plain-named-eoa
    balance: "2000000000000000000"

  # Position-derived address (neither name nor address set).
  - kind: eoa
    balance: "1000000000000000000"

  # ── 14-16. ERC-20 new-schema coverage (E1/E2/E3) ─────────────────────
  # Exercises every combination of the new owners/allowances/
  # total_owners/total_allowances knobs so the cross-client
  # genesis-root aggregator AND the per-suite Phase-4 RPC oracle
  # (CheckERC20Templates) cover all schema permutations on every
  # MPT client. Counts kept small (~10 entries) so CI runtime is flat.

  # E1 — explicit owners + explicit allowances, no random fill.
  - kind: contract
    template: erc20
    name: token-explicit
    address: 0x000000000000000000000000000000000000aa11
    parameters:
      symbol: AAA
      decimals: 18
      name: ExplicitOwnersToken
      owners:
        - { address: "0x1111111111111111111111111111111111111111", balance: "1000" }
        - { address: "0x2222222222222222222222222222222222222222", balance: "500" }
      allowances:
        - { owner: "0x1111111111111111111111111111111111111111", spender: "0x3333333333333333333333333333333333333333", allowance: "100" }

  # E2 — bulk-fill only (no explicit). Exercises the random-synthesis path.
  - kind: contract
    template: erc20
    name: token-bulk
    address: 0x000000000000000000000000000000000000aa22
    parameters:
      symbol: BBB
      decimals: 18
      name: BulkRandomToken
      total_owners: 10
      total_allowances: 5

  # E3 — explicit AND random combined (the multi-knob case).
  - kind: contract
    template: erc20
    name: token-mixed
    address: 0x000000000000000000000000000000000000aa33
    parameters:
      symbol: CCC
      decimals: 18
      name: CombinedToken
      owners:
        - { address: "0x4444444444444444444444444444444444444444", balance: "1000000" }
      total_owners: 8
      allowances:
        - { owner: "0x4444444444444444444444444444444444444444", spender: "0x5555555555555555555555555555555555555555", allowance: "1000" }
      total_allowances: 4
